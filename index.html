<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Media Landing Page Generator | 90 For Life</title>
    <meta name="description" content="Turn any TikTok or social media transcript into a compliant, high-converting Youngevity 90 For Life landing page with integrated shopping cart." />

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Static (hidden) form so Netlify's build-time bot can detect and register
      this form. The real form rendered by React (FloatingContactWidget.tsx)
      submits to this same form name via fetch, so submissions still trigger
      Netlify's email notifications even though this is a single-page app.
    -->
    <form name="lead-contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="phone" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="distributorYgyId" />
      <input type="text" name="distributorName" />
      <input type="text" name="distributorPhone" />
      <input type="text" name="distributorEmail" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
